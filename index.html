function sugCalc(){var per=[];for(var k=1;k<=6&&per.length<3;k++){var g=gastos(periodo(-k)).filter(function(m){return !m.demo;});if(g.length)per.push(g);}var n=per.length;if(!n)return sugParcial();var by={},ext=0;per.forEach(function(g){g.forEach(function(m){if(m.extra){ext++;return;}if(CATS_G.indexOf(m.cat)<0)return;by[m.cat]=(by[m.cat]||0)+conv(m,'ARS');});});var v={};Object.keys(by).forEach(function(c){v[c]=Math.ceil(by[c]/n/1000)*1000;});return {n:n,v:v,ext:ext};}
var FIJAS=['Hogar y alquiler','Servicios','Educación'];
function sugParcial(){var p=periodo(0),t=today();var g=gastos(p).filter(function(m){return !m.demo&&parse(m.fecha)<=t;});if(!g.length)return null;var dias=Math.max(1,diffDays(t,p.start)+1),tot=diffDays(p.end,p.start)+1,f=Math.min(4,tot/Math.max(dias,7));if(f<1)f=1;var by={},ext=0;g.forEach(function(m){if(m.extra){ext++;return;}if(CATS_G.indexOf(m.cat)<0)return;by[m.cat]=(by[m.cat]||0)+conv(m,'ARS');});var v={};Object.keys(by).forEach(function(c){v[c]=Math.ceil(by[c]*(FIJAS.indexOf(c)>=0?1:f)/1000)*1000;});if(!Object.keys(v).length)return null;return {n:0,v:v,ext:ext,dias:dias};}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='act-code'||e.target.id==='up-code')){e.preventDefault();activar(e.target.value);return;}if(e.key==='Enter'&&e.target.id==='rec-uid'){e.preventDefault();recuperarGo();return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.alert[role="button"]')){e.preventDefault();e.target.click();}if(e.key==='Escape'&&!$('sheetWrap').hidden)closeSheet();});

if((t.id==='c-cval'||t.id==='c-pint')&&D){if(t.id==='c-cval')D.cVal=t.value;else D.pInt=t.value;D.err='';var cr=$('c-cuo-res');if(cr)cr.innerHTML=cuoRes();return;}
if(t.getAttribute&&t.getAttribute('data-sg')!==null&&SG){var gi=+t.getAttribute('data-sg');SG.rows[gi].v=parseMonto(t.value);SG.rows[gi].ok=true;sgRefresh(gi);return;}
if(t.id==='c-ahman'&&D){D.ahMan=t.value;var cb=$('c-ahorro');if(cb)cb.textContent=ahorroHint();return;}
if(t.id==='c-nota'&&D){D.nota=t.value;if(D.tipo==='gasto'&&!D.catManual){var s=sugerir(D.nota);if(s!==D.cat){D.cat=s;$('c-cats').innerHTML=catsHtml(CATS_G);}$('c-sug').textContent=D.cat?'Sugerida por lo que escribiste':'';}else if(D.tipo==='ingreso'&&!D.catManual){var s2=sugerir(D.nota);if(s2==='Sueldo'&&D.cat!=='Sueldo'){D.cat='Sueldo';$('c-cats').innerHTML=catsHtml(CATS_I);}}return;}
if(t.id==='c-fecha'&&D){D.fecha=t.value||iso(today());return;}
var b=t.getAttribute('data-bind');if(b&&t.tagName==='INPUT'){setPath(b,t.value);save();}});
document.addEventListener('change',function(e){var t=e.target;if(t.id==='restoreInput'){copiaLeer(t.files&&t.files[0]);return;}var b=t.getAttribute('data-bind');if(!b)return;if(b==='perfil.cobro'){var cv=String(t.value),cn=parseInt(cv.slice(1),10);if(cv.charAt(0)==='h'){S.perfil.cobroTipo='habil';S.perfil.cobroHabil=cn;}else{S.perfil.cobroTipo='fijo';S.perfil.cobro=cn;}save();var ch=$('cobro-hint');if(ch)ch.innerHTML=cobroHint();if(S.onboarded)render();if(S.perfil.cobroTipo==='habil')loadFeriados();return;}if(t.tagName==='INPUT'){setPath(b,t.value);save();if(S.onboarded&&b==='perfil.nac')render();}});

render();

loadNovedades();
loadFeriados();
