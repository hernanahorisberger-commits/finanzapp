function inflMes(k){if(S.ui.inflManual!=null)return S.ui.inflManual;var M=S.macro&&S.macro.d;if(!M)return null;if(M.ipcHist&&M.ipcHist[k]!=null)return M.ipcHist[k];var y=+k.slice(0,4),m=+k.slice(5,7);if(M.anio===y&&M.meses&&M.meses[m-1]&&M.meses[m-1].ipc!=null)return M.meses[m-1].ipc;if(M.estim&&M.estim[k]!=null)return M.estim[k];return M.infBase!=null?M.infBase:null;}

function inflFac(d){var t=today(),a=d.getFullYear()*12+d.getMonth(),b=t.getFullYear()*12+t.getMonth(),f=1,ok=true;for(var i=a+1;i<=b;i++){var r=inflMes(ymKey(Math.floor(i/12),i%12));if(r==null){ok=false;continue;}f*=1+r/100;}return ok?f:1;}
