.small{font-size:13px}

.btn.sm{height:44px;font-size:14px;width:auto;padding:0 14px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}

.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.delta-up{color:var(--warn);font-weight:700}
.delta-down{color:var(--good);font-weight:700}
.delta-eq{color:var(--muted);font-weight:700}

.hor{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;font-size:13px}
.hor .hoy{font-weight:700;color:var(--text)}
.pase{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.pase[hidden]{display:none}
.pase .in{max-width:480px;width:100%;margin:0 auto;padding:24px 16px 32px;display:flex;flex-direction:column;gap:16px;flex:1}
.pase-card{border-radius:24px;padding:22px 18px;background:var(--accent);color:#11100E;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.pase-card::after{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:brillo 2.2s linear infinite}
@keyframes brillo{to{left:120%}}
.reloj{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.latido{display:inline-block;width:10px;height:10px;border-radius:99px;background:#2BD46B;animation:latido 1s ease-in-out infinite;margin-right:8px;vertical-align:2px}
@keyframes latido{50%{transform:scale(1.6);opacity:.4}}
@media (prefers-reduced-motion:reduce){.pase-card::after{animation:brillo 2.2s linear infinite!important}.latido{animation:latido 1s ease-in-out infinite!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var onbStep=0;
function renderOnb(){var h='<div class="wrap" style="padding-bottom:40px">';
if(onbStep===0){h+='<span class="serif" style="font-size:22px">Finanz<span style="color:var(--accent-ink)">App</span></span><div style="display:flex;flex-direction:column;gap:12px;margin-top:24px"><h1 style="font-size:34px">Tus gastos, cargados en 10 segundos</h1><p style="margin:0;color:var(--soft);font-size:16px;line-height:1.5">Anotás desde el celular apenas gastás, te avisa de tus vencimientos y te muestra en qué se va la plata, en pesos o en dólares.</p></div><div class="card" style="display:flex;flex-direction:column;gap:12px;margin-top:8px">'+[['plus','Cargás monto y en qué. La categoría te la sugerimos.'],['card','Cuotas repartidas solas en los meses que siguen.'],['bell','Alertas de vencimientos, aumentos y olvidos.'],['lock','Tus datos quedan solo en tu celular. Nadie más los ve.']].map(function(x){return '<div class="row small" style="color:var(--soft)"><span style="color:var(--accent-ink)">'+ic(x[0],18)+'</span><span>'+x[1]+'</span></div>';}).join('')+'</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><button type="button" class="btn" data-act="onbNext">Empezar</button><button type="button" class="btn plain" data-act="onbDemo">Ver primero con datos de ejemplo</button><button type="button" class="btn plain" data-act="copiaRestaurar">Ya la usaba: restaurar mi copia</button></div>';}
else if(onbStep===1){h+=stepsBar(1)+'<h1>Contanos un poco de vos</h1><div class="field"><label for="o-nombre">¿Cómo te llamamos?</label><input class="input" id="o-nombre" data-bind="perfil.nombre" value="'+esc(S.perfil.nombre)+'" autocomplete="given-name" placeholder="Tu nombre"></div><div class="field"><label for="o-nac">Fecha de nacimiento</label><input class="input" type="date" id="o-nac" data-bind="perfil.nac" value="'+esc(S.perfil.nac)+'"><span class="xs muted">Para saludarte en tu cumple.</span></div><div class="field"><label for="o-cobro">¿Qué día cobrás?</label><select class="input" id="o-cobro" data-bind="perfil.cobro">'+cobroOpts()+'</select><span class="xs muted" id="cobro-hint">'+cobroHint()+'</span></div><div style="display:flex;flex-direction:column;gap:8px"><button type="button" class="btn" data-act="onbNext">Siguiente</button><button type="button" class="btn plain" data-act="onbNext">Saltear este paso</button></div>';}
else{h+=stepsBar(2)+'<h1>Hacela tuya'+(S.perfil.nombre?', '+esc(S.perfil.nombre):'')+'</h1><div class="flabel">Color de la app</div>'+swatches()+'<div class="flabel">Modo</div><div class="seg" role="group"><button type="button" data-act="modo" data-v="oscuro" aria-pressed="'+(S.ui.modo==='oscuro')+'">Oscuro</button><button type="button" data-act="modo" data-v="claro" aria-pressed="'+(S.ui.modo==='claro')+'">Claro</button></div><div class="flabel">¿Cómo querés que te hablemos?</div><button type="button" class="card" style="text-align:left;display:flex;flex-direction:column;gap:4px;'+(S.perfil.tono==='humor'?'border:1.5px solid var(--accent);background:var(--accent-bg)':'')+'" data-act="tono" data-v="humor" aria-pressed="'+(S.perfil.tono==='humor')+'"><b>Con humor</b><span class="small" style="color:var(--soft)">"Llevás 5 días sin cargar gastos. ¿Modo ahorrador extremo o te olvidaste?"</span></button><button type="button" class="card" style="text-align:left;display:flex;flex-direction:column;gap:4px;'+(S.perfil.tono==='directo'?'border:1.5px solid var(--accent);background:var(--accent-bg)':'')+'" data-act="tono" data-v="directo" aria-pressed="'+(S.perfil.tono==='directo')+'"><b>Directo</b><span class="small" style="color:var(--soft)">"Hace 5 días que no cargás gastos."</span></button><button type="button" class="btn" data-act="onbFin">Empezar a usarla</button>';}
$('onb').innerHTML=h+'</div>';}
function stepsBar(n){return '<div style="display:flex;flex-direction:column;gap:8px"><div class="steps"><div class="on"></div><div class="'+(n>=2?'on':'')+'"></div></div><span class="xs muted">Paso '+n+' de 2</span></div>';}

/* ---------- ui helpers ---------- */
function openSheet(){$('sheetWrap').hidden=false;document.body.style.overflow='hidden';}
function closeSheet(){$('sheetWrap').hidden=true;document.body.style.overflow='';D=null;confirmDel=null;}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2400);}
function setPath(path,val){var a=path.split('.');S[a[0]][a[1]]=val;}

document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
switch(a){
case 'tab':tab=el.getAttribute('data-tab');mesOff=0;confirmDel=null;render();window.scrollTo(0,0);break;
case 'nuevo':nuevo('gasto');break;
case 'nuevoIngreso':nuevo('ingreso');break;
case 'cerrar':closeSheet();break;
case 'verARS':S.ui.verUSD=false;save();render();break;
case 'verUSD':if(!rate()){toast('Primero cargá la cotización en Ajustes');return;}S.ui.verUSD=true;save();render();break;
case 'mesPrev':mesOff--;render();break;
case 'mesNext':mesOff++;render();break;
case 'cTipo':if(v==='ahorro'&&!premium()){toast('Registrar ahorro e inversión es Premium');return;}D.tipo=v;D.cat=null;D.catManual=false;if(v==='ingreso')D.cat=sugerir(D.nota)==='Sueldo'?'Sueldo':null;renderCarga();break;
case 'nuevoAhorro':if(!premium()){toast('Registrar ahorro e inversión es Premium');return;}nuevo('ahorro');break;
case 'editPresu':editPresu();break;
case 'guardarPresu':guardarPresu();break;
case 'presuSugerir':presuSugerir();break;
case 'novedades':verNovedades();break;
case 'verLocal':verLocal(id);break;
case 'usarDesc':usarDesc(id,el);break;
case 'cerrarPase':cerrarPase();break;
case 'locFiltro':locFiltro=v||'';render();break;
case 'activar':activar(($('act-code')||{}).value);break;
case 'activarUp':activar(($('up-code')||{}).value);break;
case 'alPresu':S.alertas.presu=!S.alertas.presu;save();render();break;
case 'cMon':D.moneda=v;renderCarga();break;
case 'cCat':D.cat=v;D.catManual=true;renderCarga();break;
case 'cMedio':D.medio=v;if(v!=='Crédito')D.cuotas=1;renderCarga();break;
case 'cCuo':D.cuotas=parseInt(v,10);renderCarga();break;
case 'guardar':guardar();break;
case 'verMov':verMov(id);break;
case 'borrarMov':if(confirmDel!==id){confirmDel=id;el.textContent='Tocá de nuevo para confirmar';return;}var m=S.movs.find(function(x){return x.id===id;});if(m&&m.cuota){var g=m.cuota.g;S.movs=S.movs.filter(function(x){return !(x.cuota&&x.cuota.g===g);});}else S.movs=S.movs.filter(function(x){return x.id!==id;});save();closeSheet();render();toast('Borrado');break;
case 'nuevoVenc':editVenc(null,el.getAttribute('data-nombre')||'');break;
case 'editVenc':editVenc(id);break;
case 'vAprox':readVencForm();D.aprox=!D.aprox;renderVencSheet();break;
case 'vAlerta':readVencForm();D.alerta=!D.alerta;renderVencSheet();break;
case 'guardarVenc':guardarVenc();break;
case 'borrarVenc':if(confirmDel!==D.id){readVencForm();confirmDel=D.id;renderVencSheet();return;}S.vencs=S.vencs.filter(function(x){return x.id!==D.id;});save();closeSheet();render();toast('Vencimiento borrado');break;
case 'pagarVenc':pagarVenc(id);break;
case 'color':S.ui.color=v;save();render();break;
case 'modo':S.ui.modo=v;save();render();break;
case 'tono':S.perfil.tono=v;save();render();break;
case 'monedaDef':S.ui.monedaDef=v;save();render();break;
case 'dolarTipo':S.dolar.tipo=v;S.dolar.venta=null;S.dolar.fuente=null;S.dolar.fecha=null;save();fetchDolar();break;
case 'dolarFetch':fetchDolar();break;
case 'dolarManual':var n=parseMonto($('a-manual').value);if(!n){toast('Ingresá un valor, por ejemplo 1450');return;}S.dolar.venta=n;S.dolar.fuente='manual';S.dolar.fecha=new Date().toISOString();dolarErr=false;save();render();toast('Cotización guardada');break;
case 'alOn':S.alertas.on=!S.alertas.on;save();render();break;
case 'alAum':S.alertas.aumentos=!S.alertas.aumentos;save();render();break;
case 'alRec':S.alertas.recordatorio=!S.alertas.recordatorio;save();render();break;
case 'anticip':S.alertas.anticip=parseInt(v,10);save();render();break;
case 'exportar':exportar();break;
case 'copiaGuardar':copiaGuardar();break;
case 'copiaRestaurar':var ri=$('restoreInput');ri.value='';ri.click();break;
case 'copiaAplicar':copiaAplicar();break;
case 'copiarCsv':copiarCsv();break;
case 'demo':demo();tab='inicio';render();toast('Datos de ejemplo cargados');break;
case 'borrarDemo':borrarDemo();break;
case 'borrarTodo':if(confirmDel!=='todo'){confirmDel='todo';render();return;}var keep={perfil:S.perfil,ui:S.ui,dolar:S.dolar,alertas:S.alertas,lic:S.lic,presu:S.presuDemo?{}:S.presu,novVistas:S.novVistas};S=defaults();S.perfil=keep.perfil;S.ui=keep.ui;S.dolar=keep.dolar;S.alertas=keep.alertas;S.lic=keep.lic;S.presu=keep.presu;S.novVistas=keep.novVistas;S.onboarded=true;confirmDel=null;save();render();toast('Borramos tus movimientos y vencimientos');break;
case 'onbNext':onbStep++;renderOnb();$('onb').scrollTop=0;break;
case 'onbDemo':demo();render();toast('Datos de ejemplo cargados');break;
case 'onbFin':S.onboarded=true;save();render();break;
}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='act-code'||e.target.id==='up-code')){e.preventDefault();activar(e.target.value);return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.alert[role="button"]')){e.preventDefault();e.target.click();}if(e.key==='Escape'&&!$('sheetWrap').hidden)closeSheet();});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='act-code'){actCode=t.value;return;}if(t.id==='c-monto'&&D){D.monto=t.value;D.err='';var c=$('c-conv');if(c)c.textContent=convHint();return;}
if(t.id==='c-nota'&&D){D.nota=t.value;if(D.tipo==='gasto'&&!D.catManual){var s=sugerir(D.nota);if(s!==D.cat){D.cat=s;$('c-cats').innerHTML=catsHtml(CATS_G);}$('c-sug').textContent=D.cat?'Sugerida por lo que escribiste':'';}else if(D.tipo==='ingreso'&&!D.catManual){var s2=sugerir(D.nota);if(s2==='Sueldo'&&D.cat!=='Sueldo'){D.cat='Sueldo';$('c-cats').innerHTML=catsHtml(CATS_I);}}return;}
if(t.id==='c-fecha'&&D){D.fecha=t.value||iso(today());return;}
var b=t.getAttribute('data-bind');if(b&&t.tagName==='INPUT'){setPath(b,t.value);save();}});
document.addEventListener('change',function(e){var t=e.target;if(t.id==='restoreInput'){copiaLeer(t.files&&t.files[0]);return;}var b=t.getAttribute('data-bind');if(!b)return;if(b==='perfil.cobro'){var cv=String(t.value),cn=parseInt(cv.slice(1),10);if(cv.charAt(0)==='h'){S.perfil.cobroTipo='habil';S.perfil.cobroHabil=cn;}else{S.perfil.cobroTipo='fijo';S.perfil.cobro=cn;}save();var ch=$('cobro-hint');if(ch)ch.innerHTML=cobroHint();if(S.onboarded)render();if(S.perfil.cobroTipo==='habil')loadFeriados();return;}if(t.tagName==='INPUT'){setPath(b,t.value);save();if(S.onboarded&&b==='perfil.nac')render();}});
var qCode=null;try{qCode=new URLSearchParams(location.search).get('codigo');if(qCode&&history.replaceState)history.replaceState(null,'',location.pathname);}catch(e){}
render();
if(qCode&&S.lic.plan!=='P')activar(qCode);else verificarLic();
loadNovedades();
loadFeriados();
document.addEventListener('visibilitychange',function(){if(!document.hidden){verificarLic();loadLocales();}});
loadLocales();if(!S.dolar.fecha||S.dolar.fuente==='auto'&&Date.now()-new Date(S.dolar.fecha).getTime()>3*3600000)fetchDolar(true);
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
